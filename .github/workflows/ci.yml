name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Chess-Multiplayer/package-lock.json

      - name: Install dependencies
        working-directory: Chess-Multiplayer
        run: npm ci

      - name: Run tests
        working-directory: Chess-Multiplayer
        run: npm test
